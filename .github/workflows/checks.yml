name: Validate Heat Atlas
on: [push, pull_request]
jobs:
  data-and-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check routing-worker.js
      - run: npm test
